name: release

# Owner-triggered releases only: pushing a semantic-version tag starts the
# workflow. Agents never tag or release; see docs/RELEASE.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  FLUTTER_ARCHIVE: flutter_linux_3.47.7-stable.tar.xz
  FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Configure this environment with required reviewers in repository
    # settings. Secrets are repository-scoped today; the environment records
    # the owner approval boundary for future environment-scoped secrets.
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Flutter
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/$FLUTTER_ARCHIVE"
          curl -fsSLo "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$FLUTTER_ARCHIVE"
          echo "$FLUTTER_SHA256  $archive" | sha256sum -c -
          tar -xf "$archive" -C "$RUNNER_TOOL_CACHE"
          echo "$RUNNER_TOOL_CACHE/flutter/bin" >> "$GITHUB_PATH"

      # No signing secret is referenced before this gate passes. The Gradle
      # task is the same authoritative guard used by release builds, so the
      # placeholder applicationId cannot be released through this workflow.
      - name: Preflight (identity, version, changelog)
        run: |
          set -Eeuo pipefail
          flutter pub get
          (cd packages/lift_core && dart pub get)
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "FAIL: the tagged commit is not on main." >&2
            exit 1
          fi
          tag="$GITHUB_REF_NAME"
          version="$(dart run tool/guards/check_changelog.dart --print-version)"
          if [[ "$tag" != "v$version" ]]; then
            echo "FAIL: tag $tag does not match pubspec version $version." >&2
            exit 1
          fi
          dart run tool/guards/check_changelog.dart --tag "$tag"
          flutter_root="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" ]]; then
            echo "FAIL: Android SDK path is not set." >&2
            exit 1
          fi
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$flutter_root" "$sdk" \
            > android/local.properties
          (cd android && ./gradlew --console=plain :app:verifyReleaseApplicationId)
          echo "Preflight passed: identity, version, changelog, applicationId."

      # Section 37.4: a release requires the full gate to be green, not only a
      # successful APK build.
      - name: Verification gate
        run: bash scripts/verify.sh

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("ANDROID_KEYSTORE_BASE64 secret")
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD secret")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("ANDROID_KEY_ALIAS secret")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("ANDROID_KEY_PASSWORD secret")
          [[ -n "${CERT_SHA256:-}" ]] || missing+=("ANDROID_CERT_SHA256 repository variable")
          if (( ${#missing[@]} > 0 )); then
            printf 'FAIL: missing %s. See docs/RELEASE.md.\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "Signing secrets are present; no value is printed."

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GYM_LOG_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
          GYM_LOG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GYM_LOG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GYM_LOG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          keystore="$GYM_LOG_KEYSTORE_PATH"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          [[ -s "$keystore" ]] || {
            echo "FAIL: decoded keystore is empty." >&2
            exit 1
          }
          # Passwords travel only through the environment, never argv or logs.
          flutter build apk --release
          rm -f "$keystore"
          trap - EXIT
          echo "Signed release APK built."

      - name: Verify signing certificate
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          tool/release/verify_apk_certificate.sh \
            build/app/outputs/flutter-apk/app-release.apk \
            "$EXPECTED_CERT"

      - name: Name APK and generate checksums
        run: |
          set -Eeuo pipefail
          version="$(dart run tool/guards/check_changelog.dart --print-version)"
          tool/release/package_apk.sh \
            build/app/outputs/flutter-apk/app-release.apk \
            "$version" \
            dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="$GITHUB_REF_NAME"
          version="$(dart run tool/guards/check_changelog.dart --print-version)"
          schema="$(dart run tool/guards/check_changelog.dart --tag "$tag" --print-schema)"
          notes="$RUNNER_TEMP/release-notes.md"
          dart run tool/guards/check_changelog.dart --tag "$tag" --print-notes > "$notes"

          flags=(--verify-tag --title "Gym Log $tag" --notes-file "$notes")
          if [[ "$schema" == "none" ]]; then
            flags+=(--latest)
          else
            # DAT-008: schema-changing builds go to friends as pre-release
            # first. Promote manually only after the upgrade drill.
            flags+=(--prerelease --latest=false)
          fi

          gh release create "$tag" \
            "dist/gym-log-v$version.apk" \
            "dist/gym-log-v$version.apk.sha256" \
            "${flags[@]}"
