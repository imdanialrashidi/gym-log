name: gym_log
description: Local-first, offline workout log for Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: "3.13.5"
  flutter: "3.47.7"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 2.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  image: 4.12.0
  image_picker: 1.2.4
  intl: 0.20.3
  lift_core:
    path: packages/lift_core
  material_ui: 1.8.0
  url_launcher: 6.3.2
  path_provider: 2.1.6
  # 2.3.x pulls jni, which hardcodes compileSdk 35; the toolchain ships 36.
  path_provider_android: 2.2.23
  shamsi_date: 1.1.1
  uuid: 4.6.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
